[package]
name = "waybap"
version = "0.1.0"
edition = "2024"
authors = [ "kittyandrew <andrew@kittymail.me>" ]

[profile.release]
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true
lto = "fat"

[dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-aux = "4.7.0"
serde_json = "1.0.149"
tiny_http = "0.12.0"
